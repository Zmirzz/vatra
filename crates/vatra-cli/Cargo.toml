[package]
name = "vatra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vatra"
path = "src/main.rs"

[lib]
name = "vatra_cli"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
vatra-service = { path = "../vatra-service" }
vatra-claude = { path = "../vatra-claude" }
vatra-core = { path = "../vatra-core" }
vatra-engine = { path = "../vatra-engine" }
vatra-extensions = { path = "../vatra-extensions" }
vatra-import = { path = "../vatra-import" }
vatra-models = { path = "../vatra-models" }

[dev-dependencies]
axum.workspace = true
rmcp.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }
